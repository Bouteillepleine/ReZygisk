<div class="panel">
  <div class="header">ReZygisk</div>

  <!-- INFO: Status card -->
  <div id="info_card" class="bright card list">
    <div class="status_row">
      <div id="rz_icon_state" class="status_badge">
        <img src="assets/mark.svg" alt="">
      </div>

      <div id="rz_state" class="status_text lock">
        {{unknown}}
      </div>
    </div>
  </div>

  <div class="section_label">ROM / Kernel</div>

  <div class="dim card">
    <div id="android_version" class="row">
      <div class="row_label">{{androidVersion}}</div>
      <div class="row_value" id="android_version_div">{{unknown}}</div>
    </div>
    <div id="kernel_version" class="row">
      <div class="row_label">{{linuxKernelVersion}}</div>
      <div class="row_value" id="kernel_version_div">{{unknown}}</div>
    </div>
  </div>

  <div class="section_label">Root / ReZygisk</div>

  <div class="dim card">
    <div class="row">
      <div class="row_label">{{info.version}}</div>
      <div class="row_value" id="version_code">{{unknown}}</div>
    </div>
    <div class="row">
      <div class="row_label">{{info.root}}</div>
      <div class="row_value" id="root_impl">{{unknown}}</div>
    </div>
  </div>

  <div id="zygote_class">
    <div class="section_label">Zygotes</div>

    <div class="dim card">
      <div id="zygote64" class="row">
        <div class="row_label">Zygote64</div>
        <div class="row_value" id="zygote64_status">{{unknown}}</div>
      </div>
      <div id="zygote32" class="row">
        <div class="row_label">Zygote32</div>
        <div class="row_value" id="zygote32_status">{{unknown}}</div>
      </div>
    </div>
  </div>
</div>
