<div class="panel">
  <div class="header">ReZygisk: {{title}}</div>

  <div class="dim card">
    <div class="monitor_state">
      <div id="monitor_title" class="monitor_title">{{monitor.title}}</div>
      <div id="monitor_status" class="monitor_status">{{monitor.status.unknown}}</div>
    </div>

    <div class="button_list">
      <div id="monitor_start_button" class="center button button_primary">{{monitor.button.start}}</div>
      <div id="monitor_pause_button" class="center button">{{monitor.button.pause}}</div>
      <div id="monitor_stop_button" class="center button button_danger">{{monitor.button.stop}}</div>
    </div>
  </div>
</div>
