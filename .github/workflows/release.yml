name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    environment: signing
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: "recursive"
          fetch-depth: 0
          persist-credentials: false

      - name: Setup NDK_PATH
        run: echo "NDK_PATH=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Build
        run: make all -j"$(nproc)"

      # INFO: The signing key is only written after the build, so no Makefile,
      #         submodule or sign.py build step ever runs with it present.
      - name: Sign
        env:
          private_key: ${{ secrets.ORG_PRIVATE_KEY }}
          public_key: ${{ secrets.ORG_PUBLIC_KEY }}
        run: |
          if [ -z "$private_key" ] || [ -z "$public_key" ]; then
            echo "::notice::No signing keys configured, publishing unsigned builds."
            exit 0
          fi

          echo "$private_key" | base64 -d > module/private_key
          echo "$public_key" | base64 -d > module/public_key

          make BUILD_TYPE=release sign
          make BUILD_TYPE=debug sign

          rm -f module/private_key module/public_key

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ReZygisk-${{ github.ref_name }}
          path: "build/out/ReZygisk-v*.zip"
          archive: false
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/out/ReZygisk-v*.zip --generate-notes --title "$GITHUB_REF_NAME"
